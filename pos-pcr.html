<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bancada NGS Pós-PCR</title>
<style>
:root{--bg:#EEF2F5;--surface:#FFFFFF;--ink:#14202A;--muted:#566573;--line:#D3DCE3;--post:#AE3A2D;--post-bg:#F8E6E3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E141A;--surface:#16202A;--ink:#E3EAF0;--muted:#94A3B0;--line:#2A3743;--post:#EC8174;--post-bg:#3A1D1A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141A;--surface:#16202A;--ink:#E3EAF0;--muted:#94A3B0;--line:#2A3743;--post:#EC8174;--post-bg:#3A1D1A;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:start;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--post-bg);color:var(--post)}
h1{margin:0;font-size:28px} p{margin:0;color:var(--muted)} a{color:var(--post);font-weight:700}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<main>
  <span class="tag">Área pós-PCR</span>
  <h1>Módulo pós-PCR em construção</h1>
  <p>Este módulo vai começar lendo o pacote <code>_pre-pcr.json</code> gerado no fim do pré-PCR (etapa Placa de PCR): mapa da placa, códigos das amostras, normalização e validação do QIAgility.</p>
  <p><a href="index.html">← Voltar aos módulos</a></p>
</main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Bancada NGS Pré-PCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: estação de bancada — barra da corrida no topo, trilho de etapas à esquerda colorido pela área do laboratório (pré/pós-PCR), coluna de trabalho à direita */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F8FA; --ink:#14202A; --muted:#566573; --line:#D3DCE3;
  --pre:#0A6A86; --pre-bg:#E2F0F5; --post:#AE3A2D; --post-bg:#F8E6E3;
  --mag:#6D3FB0; --mag-bg:#F0EAF9; --ice:#1F6FB8; --ice-bg:#E4F0FB;
  --ok:#2C7A4B; --ok-bg:#E3F2E8; --warn:#9A5B00; --warn-bg:#FBEFD9; --bad:#AE3A2D; --bad-bg:#F8E6E3;
  --m1:#0A6A86; --m2:#7A4FB0; --m3:#2C7A4B; --m4:#B5631A; --m5:#B03A6E; --m6:#4A5FB8; --dil:#0E9AA7;
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#16202A; --sunk:#111A22; --ink:#E3EAF0; --muted:#94A3B0; --line:#2A3743;
  --pre:#5BB8D6; --pre-bg:#123040; --post:#EC8174; --post-bg:#3A1D1A;
  --mag:#B79AF0; --mag-bg:#2A2140; --ice:#7DB8EE; --ice-bg:#16283C;
  --ok:#72C595; --ok-bg:#16301F; --warn:#E8B055; --warn-bg:#352812; --bad:#EC8174; --bad-bg:#3A1D1A;
  --m1:#5BB8D6; --m2:#B08BE0; --m3:#72C595; --m4:#E39A55; --m5:#E27DAA; --m6:#8C9DF0; --dil:#4FD1DB;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#16202A; --sunk:#111A22; --ink:#E3EAF0; --muted:#94A3B0; --line:#2A3743;
  --pre:#5BB8D6; --pre-bg:#123040; --post:#EC8174; --post-bg:#3A1D1A;
  --mag:#B79AF0; --mag-bg:#2A2140; --ice:#7DB8EE; --ice-bg:#16283C;
  --ok:#72C595; --ok-bg:#16301F; --warn:#E8B055; --warn-bg:#352812; --bad:#EC8174; --bad-bg:#3A1D1A;
  --m1:#5BB8D6; --m2:#B08BE0; --m3:#72C595; --m4:#E39A55; --m5:#E27DAA; --m6:#8C9DF0; --dil:#4FD1DB;
  color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pre);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.u{text-transform:none;letter-spacing:0}

.runbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{font-size:20px}
.brand span{color:var(--muted);font-size:13px}
.home{font-size:13px;font-weight:700;color:var(--pre);text-decoration:none;align-self:start}
.home:hover{text-decoration:underline}
.conds{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.ico{display:inline-flex;align-items:center;gap:6px;vertical-align:-3px;margin-right:6px}
.ico svg{width:18px;height:18px;flex:none}
.ico-magneto{color:var(--mag)} .ico-gelo{color:var(--ice)}
.ico.big{padding:5px 12px 5px 9px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid currentColor;margin:0}
.ico.big svg{width:22px;height:22px}
.ico.big span{color:var(--ink)}
.ico-magneto.big{background:var(--mag-bg)} .ico-gelo.big{background:var(--ice-bg)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field input,.field select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.field select{max-width:280px}
.f-batch input{width:calc(25ch + 24px);max-width:100%;font-family:var(--f-mono);font-weight:500}
.f-batch .label{color:var(--pre)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pre);border-color:var(--pre);color:var(--surface)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pre)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.deck-wrap{overflow-x:auto}
.deckmap{display:grid;grid-template-columns:150px minmax(270px,1fr) minmax(270px,1fr);grid-template-areas:"m1 a1 a2" "r1 b1 b2" "r1 c1 c2";gap:10px;min-width:720px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px}
.sock{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sock.k-stock{border-color:var(--pc);box-shadow:inset 0 3px 0 var(--pc)}
.sock.k-empty{opacity:.6}
.rgrid{display:grid;grid-template-columns:1fr;gap:4px;justify-items:start}
.rgrid .tube{flex-direction:row;gap:6px}
.tube.cp i{background:var(--warn);border-color:var(--warn)} .tube.cp{color:var(--ink);font-weight:700}
.mp .d.cp{background:var(--warn);border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--surface)}
.sock-h{display:flex;gap:8px;align-items:baseline}
.sock-h .pos{font-family:var(--f-mono);font-size:13px;background:var(--ink);color:var(--surface);padding:0 6px;border-radius:4px}
.sock-h span{font-family:var(--f-display);font-weight:700;font-size:14px}
.sock small{font-size:12.5px;color:var(--muted)} .sock small b{color:var(--ink)}
.mp{display:grid;grid-template-columns:12px repeat(12,minmax(0,1fr));gap:2px;align-items:center}
.mp .mh{font-family:var(--f-mono);font-size:9px;color:var(--muted);text-align:center;border-radius:3px}
.mp .mh.open{background:var(--ink);color:var(--surface);font-weight:700}
.mp .d{aspect-ratio:1;border-radius:50%;border:1.2px solid var(--line);background:var(--surface)}
.mp .d.on{background:var(--pc);border-color:var(--pc)}
.mp .d.tip{background:var(--muted);border-color:var(--muted)}
.mp .d.dil{background:var(--dil);border-color:var(--dil)}
.mp .d.man{border:1.5px dashed var(--warn)}
.mp .d.sealed{background:var(--line);border-color:var(--line)}
.mp .d.sealed.on{opacity:.4}
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px}
.pkg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pkg-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pkg-meta{font-size:12.5px;color:var(--muted)}
.pick{max-width:340px}
.pick button{font:inherit;cursor:pointer;padding:0}
.pick .mh{border:0;background:transparent;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.pick .mh:hover{background:var(--sunk);color:var(--ink)}
.pick .d.on{background:var(--pc);border-color:var(--pc)}
.pick .d.claimed{border:1.5px dashed var(--warn)}
.pick .d.bad{border:2px solid var(--bad)}
.pick .d.ctl:not(.on){border-style:dotted}
.pick .d.none{border-color:transparent;background:transparent}
.pick .d.meas.on{box-shadow:0 0 0 2px var(--ink)}
.qpick{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:16px 28px;align-items:start}
@media (max-width:700px){.qpick{grid-template-columns:1fr}}
.recipe{border:1px solid var(--line);border-left:4px solid var(--post);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.recipe-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.calc{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.steps-mini{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.qcell{display:grid;grid-template-columns:auto 1fr 84px;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);min-width:0}
.qcell.has{border-color:var(--post)}
.qcode{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcell input{width:100%;text-align:right}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px 20px}
.charts figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.charts figcaption{font-weight:700;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .tk.strong{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--post)}
.chart .bar:hover,.chart .pt:hover{opacity:.75}
.chart .band{fill:var(--m1);opacity:.08}
.chart .pt{stroke:var(--surface);stroke-width:2}
.medl{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.chart-empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:16px}
.legend svg{vertical-align:-1px;margin-right:4px}
.well.qw{align-items:center;text-align:center;gap:0}
.well.qw.meas{border-color:var(--post)} .well.qw.medn{border-color:var(--line);border-style:dashed} .well.qw.qwarn{border-color:var(--warn);border-width:2px}
.well .qv{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--ink)} .well .qd{font-family:var(--f-mono);color:var(--muted)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.tubes{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;justify-items:center}
.tube{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tube i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.tube.big{grid-column:1/-1} .tube.big i{width:32px;height:32px}
.tube.dil i{background:var(--dil);border-color:var(--dil)} .tube.dil{color:var(--ink);font-weight:700}
.rblock{flex:1;min-height:60px;border:1px dashed var(--line);border-radius:4px}
.deck-steps ol{margin:6px 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;max-width:95ch}
.deck-steps .pl{font-weight:700;color:var(--ink);box-shadow:inset 0 -3px 0 var(--pc)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.reset-opts{display:flex;flex-direction:column;gap:8px}
.reset-opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px}
.reset-opt b{display:block;font-family:var(--f-display)}
.reset-opt span{color:var(--muted);font-size:13.5px}
@media (max-width:520px){.reset-opt{grid-template-columns:minmax(0,1fr)}}

.frame{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;padding:20px 16px;max-width:1360px;margin:0 auto}
@media (max-width:860px){.frame{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.zone-h{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.zone-h.pre{color:var(--pre)} .zone-h.post{color:var(--post)}
.zone-h::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
@media (max-width:860px){.zone-h{display:none}}
.stp{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:8px;cursor:pointer;min-width:200px}
.stp:hover{background:var(--surface)}
.stp.active{background:var(--surface);border-color:var(--line)}
.stp .ix{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--pre);color:var(--pre)}
.stp.post .ix{border-color:var(--post);color:var(--post)}
.stp.done .ix{background:var(--pre);color:var(--surface)}
.stp.post.done .ix{background:var(--post)}
.stp.locked{opacity:.6}
.stp b{display:block;font-size:14px;line-height:1.3}
.stp small{color:var(--muted);font-size:12.5px}

.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.stephead{display:flex;flex-direction:column;gap:6px}
.zone{display:inline-flex;align-self:start;gap:6px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.zone.pre{background:var(--pre-bg);color:var(--pre)} .zone.post{background:var(--post-bg);color:var(--post)}
.stephead h2{font-size:26px}
.stephead p{margin:0;color:var(--muted);max-width:75ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.panel-h h3{font-size:16px}
.banner{border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--pre-bg);color:var(--pre)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner .btn{color:var(--ink)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.issues li{display:flex;gap:8px;align-items:baseline}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.empty strong{color:var(--ink)}

/* entrada de arquivos */
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--sunk)}
.drop.drag{border-color:var(--pre);background:var(--pre-bg)}
.drop.filled{border-style:solid;background:var(--surface)}
.drop h4{margin:0;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.drop .ext{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.filelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.filelist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
.filelist b{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.filelist small{display:block;color:var(--muted);font-size:12.5px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--sunk);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.45}
tr.ctl td{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
td input.cell,td select.cell{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-family:var(--f-mono);font-size:13px}
td input.cell{width:64px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--pre-bg);color:var(--pre)}
.well-tag{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:1px 6px;border-radius:4px;background:var(--pre-bg);color:var(--pre)}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks li label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border-radius:6px;cursor:pointer}
.checks li label:hover{background:var(--sunk)}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--pre)}
.checks .done-t{color:var(--muted);text-decoration:line-through}
.checks li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.checks li label{flex:1;min-width:0}
.checks li.alert-item label{background:var(--warn-bg);color:var(--warn)}
.timer{font-family:var(--f-mono);min-width:7.5em;justify-content:center}
.timer.t-run{background:var(--pre);border-color:var(--pre);color:var(--surface)}
.timer.t-done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.autoline{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px}
.abox{width:18px;height:18px;border-radius:4px;border:1.5px dashed var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface)}
.abox.on{background:var(--ok);border:1.5px solid var(--ok)}
.src-line{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.src-line b{color:var(--ink)}
.checks time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.warnlist{margin:0;padding-left:18px;color:var(--warn);font-size:14px}

.ctrls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.ctrls .field input{width:110px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--pre);width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--sunk);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.seg button small{font-weight:400;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.kpis{display:flex;flex-wrap:wrap;gap:8px 28px}
.kpi{display:flex;flex-direction:column}
.kpi .num{font-size:22px;font-weight:500}

/* deck do QIAgility */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--sunk)}
.slot.used{background:var(--surface);border-color:var(--pre);box-shadow:inset 3px 0 0 var(--pre)}
.slot .pos{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.slot b{font-family:var(--f-display);font-size:15px}
.slot small{color:var(--muted);font-size:12.5px}
.slot select{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.fetch{display:flex;flex-wrap:wrap;gap:8px}
.fetch span{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13.5px;background:var(--sunk)}
.fetch b{font-family:var(--f-mono)}

.mixes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px}
@media (max-width:420px){.mixes{grid-template-columns:minmax(0,1fr)}}
.mix{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.mix-h{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.mix-h b{font-family:var(--f-display)}
.mix .tbl{border:0;border-radius:0}

.plate{overflow-x:auto}
.grid{display:grid;grid-template-columns:22px repeat(12,minmax(56px,1fr));gap:3px;min-width:720px}
.grid .hd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;align-self:center}
.well{border-radius:5px;border:1.5px solid var(--line);min-height:44px;padding:3px 4px;font-size:10.5px;line-height:1.2;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:var(--sunk)}
.well.fill{background:var(--surface);border-color:var(--m1)}
.well.cp{border-color:var(--m4)} .well.cn{border-color:var(--m2);border-style:dashed} .well.man{border-style:dotted}
.well .lc{font-weight:700;color:var(--muted);font-family:var(--f-mono)}
.well .sid{font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1.5px solid}

details.importer{border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.importer summary{cursor:pointer;font-weight:700;font-size:14px}
details.importer[open] summary{margin-bottom:10px}
textarea{width:100%;min-height:120px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--f-mono);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:13px;margin:0}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,16,22,.5)}
.dlg{display:flex;flex-direction:column;gap:12px;padding:18px}
.dlg textarea{min-height:46vh}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:700;font-size:14px;z-index:10;max-width:calc(100vw - 32px)}

<script>
/* ===== Bancada NGS · núcleo (parsers, consolidação, normalização, QIAgility) ===== */
const ROWS8 = 'ABCDEFGH';
const numBR = v => { if (v == null || v === '') return null; const n = parseFloat(String(v).trim().replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const wellName = (idx, rows = 8) => ROWS8[(idx - 1) % rows] + (Math.floor((idx - 1) / rows) + 1);           // 1-based, por coluna
const wellIndex = (row, col, rows = 8) => (Number(col) - 1) * rows + (ROWS8.indexOf(String(row).toUpperCase()) + 1);

/* ---------- sigilo: código IL_INICIAIS ---------- */
/* regra do laboratório: inicial de TODAS as palavras, inclusive preposições (ANA DE SOUZA → ADS) */
function initials(name) {
  return String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9\s'-]/g, ' ')
    .split(/[\s'-]+/).filter(Boolean).map(w => w[0]).join('');
}
const sampleCode = (il, ini) => String(il).padStart(7, '0') + (ini ? '_' + ini : '');

/* ---------- lista do LIMS (TXT) ---------- */
function controlKind(id, name) {
  // Só o NOME INTEIRO identifica controle; palavras soltas (ex.: sobrenome "BRANCO") não contam.
  const n = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
  if (String(id) === '0' || /^(CONTROLE NEGATIVO|CN|NTC|BRANCO|BRANCO DE REACAO)$/.test(n)) return 'cn';
  if (/^(CONTROLE POSITIVO|CP)$/.test(n)) return 'cp';
  if (/^CONTROLE\b/.test(n)) return 'ctl';
  return 'sample';
}
function parseLimsTxt(text) {
  const out = [], bad = [];
  text.replace(/^﻿/, '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const m = line.match(/^(\d+)\s*[_;\t,]\s*(.*)$/);
    if (!m) { bad.push({ line: i + 1, text: line }); return; }
    out.push({ id: m[1], ini: initials(m[2]), kind: controlKind(m[1], m[2]) });  // o nome completo é descartado aqui
  });
  return { entries: out, bad };
}

/* ---------- mapa de trabalho (PDF) ---------- */
/* items: [{str, x, y, w}] com y crescendo para BAIXO (normalizado antes de chamar) */
function itemsToRows(items, tol = 3) {
  const sorted = items.filter(i => i.str && i.str.trim()).slice().sort((a, b) => a.y - b.y || a.x - b.x);
  const rows = [];
  sorted.forEach(it => {
    const L = rows.find(l => Math.abs(l.y - it.y) <= tol);
    if (L) L.items.push(it); else rows.push({ y: it.y, items: [it] });
  });
  return rows.sort((a, b) => a.y - b.y).map(l => {
    l.items.sort((a, b) => a.x - b.x);
    let s = '', end = null;
    l.items.forEach(it => { if (end != null) s += (it.x - end > 1.2 ? ' ' : ''); s += it.str; end = it.x + (it.w || 0); });
    return { y: l.y, items: l.items, text: s };
  });
}
const itemsToLines = (items, tol) => itemsToRows(items, tol).map(r => r.text);
function parseMapRow(line) {
  const t = line.replace(/\|/g, ' ').split(/\s+/).filter(Boolean);
  if (t.length < 8 || !/^\d{1,3}$/.test(t[0])) return null;
  let k = -1; for (let i = t.length - 1; i > 0; i--) if (/^(PLACA|CAIXA|RACK|TUBO)$/i.test(t[i])) { k = i; break; }
  if (k < 0 || t.length < k + 4) return null;
  const firstAlpha = t.findIndex((x, i) => i > 0 && /^[^\d]+$/.test(x));
  if (firstAlpha < 2 || !/^\d{3,10}$/.test(t[firstAlpha - 1])) return null;
  let j = k - 1; while (j > firstAlpha && /^[xX]$/.test(t[j])) j--;
  const seq2 = /^\d{1,3}$/.test(t[j]) ? t[j--] : null;
  const nums = []; while (j > firstAlpha && /^\d+([.,]\d+)?$/.test(t[j])) nums.unshift(t[j--]);
  const donor = /^[SN]$/i.test(t[j]) ? t[j--].toUpperCase() : '';
  const name = t.slice(firstAlpha, j + 1).join(' ');
  return {
    seq: parseInt(t[0], 10), amostra: t.slice(1, firstAlpha - 1).join(' '), id: t[firstAlpha - 1], ini: initials(name), donor,
    conc: nums.length ? numBR(nums[0]) : null, r260: nums.length > 1 ? numBR(nums[1]) : null, seq2,
    storeType: t[k].toUpperCase(), storeNum: t[k + 1], col: t[k + 2], row: (t[k + 3] || '').toUpperCase(),
    kit: t.slice(k + 4).join(' ')
  };
}
function parseMapLines(lines) {
  let code = '';
  for (const l of lines) { const m = l.match(/\b([A-Z]{2,8}\d{6,8}[A-Z0-9]*)\b/); if (m) { code = m[1]; break; } }
  const rows = lines.map(parseMapRow).filter(Boolean);
  return { code, rows };
}

/* ---------- consolidação ---------- */
function consolidate(txt, maps, manual = {}) {
  const issues = [];
  const pdfRows = []; maps.forEach(m => m.rows.forEach(r => pdfRows.push({ ...r, mapCode: m.code, file: m.file })));
  const byId = new Map(); pdfRows.forEach(r => { if (byId.has(r.id)) issues.push(['bad', `Amostra ${r.id} aparece em mais de um mapa.`]); byId.set(r.id, r); });
  const seqs = pdfRows.map(r => r.seq).sort((a, b) => a - b);
  if (new Set(seqs).size !== seqs.length) issues.push(['bad', 'Há números SEQ repetidos entre os mapas.']);
  else if (seqs.length && seqs[seqs.length - 1] - seqs[0] + 1 !== seqs.length) issues.push(['warn', `A numeração SEQ dos mapas não é consecutiva (${seqs.join(', ')}).`]);
  const entries = txt.length ? txt : pdfRows.slice().sort((a, b) => a.seq - b.seq).map(r => ({ id: r.id, ini: r.ini, kind: 'sample' }));
  const seen = new Set();
  const rows = entries.map((e, i) => {
    const p = byId.get(e.id), m = manual[e.id] || {};
    seen.add(e.id);
    const ini = e.ini || p?.ini || '', kind = m.kind || e.kind;
    const r = { pos: i + 1, id: e.id, ini, code: sampleCode(e.id, ini), kind, origKind: e.kind, kindEdited: !!m.kind && m.kind !== e.kind, donor: p?.donor || '',
      conc: m.conc ?? p?.conc ?? null, r260: p?.r260 ?? null, storeType: m.storeType ?? p?.storeType ?? '', storeNum: m.storeNum ?? p?.storeNum ?? '',
      col: m.col ?? p?.col ?? '', row: m.row ?? p?.row ?? '', mapCode: p?.mapCode || '', kit: p?.kit || '', pdfSeq: p?.seq ?? null,
      found: !!p, edited: ['conc', 'storeNum', 'col', 'row'].some(k => m[k] != null), source: m.source || (kind === 'cn' ? 'diluent' : (p || m.storeNum ? 'stock' : (kind === 'sample' ? 'stock' : kind === 'cp' ? 'tube' : 'manual'))) };
    if (r.source === 'tube' && (r.conc == null || r.conc <= 0)) issues.push(['bad', `${r.code}: informe a concentração (ng/µL) do microtubo no bloco R1.`]);
    if (r.kindEdited) issues.push(['warn', `${r.code}: tipo alterado manualmente${m.kindBy ? ' (' + m.kindBy + ')' : ''}.`]);
    if (p && p.seq !== i + 1) issues.push(['warn', `${e.id}: posição ${i + 1} no TXT, SEQ ${p.seq} no mapa.`]);
    if (!p && kind === 'sample' && r.source === 'stock' && !m.storeNum) issues.push(['bad', `${e.id}: não encontrada nos mapas PDF. Informe placa, posição e concentração.`]);
    if (p && e.ini && p.ini && e.ini !== p.ini) issues.push(['warn', `${e.id}: iniciais diferentes entre TXT (${e.ini}) e mapa (${p.ini}).`]);
    return r;
  });
  pdfRows.forEach(p => { if (!seen.has(p.id)) issues.push(['bad', `${p.id} (SEQ ${p.seq}) está no mapa ${p.mapCode} mas não na lista TXT.`]); });
  return { rows, issues };
}
const norm = s => String(s).normalize('NFD').replace(/[^\w]/g, '').toUpperCase();

/* ---------- normalização ---------- */
const brNum = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toString().replace('.', ',');
function normalizeAuto(r, c) {
  // QIAgility: DNA + diluente direto no poço de reação, volume final fixo.
  // Comportamento observado no relatório pós-corrida: abaixo do volume mínimo o robô pipeta o mínimo
  // e completa com diluente; a concentração final fica acima do alvo (poço marcado com *).
  const o = { vDNA: null, vDil: null, finalConc: null, adjusted: false, status: ['bad', 'Sem concentração'] };
  if (r.source === 'diluent') return { ...o, vDNA: 0, vDil: c.finalVol, finalConc: 0, status: ['ok', 'Diluente'] };
  if (r.source === 'manual') return { ...o, status: ['warn', 'Adicionar manualmente'] };
  if (r.conc == null || r.conc <= 0) return o;
  if (r.conc <= c.target) return c.allowBelow
    ? { ...o, vDNA: c.finalVol, vDil: 0, finalConc: r.conc, status: ['warn', 'Abaixo do alvo: DNA puro'] }
    : { ...o, status: ['bad', 'Abaixo do alvo'] };
  const vDNA = c.target * c.finalVol / r.conc;
  if (vDNA < c.minVol) {
    if (!c.autoAdjust) return { ...o, vDNA, vDil: c.finalVol - vDNA, finalConc: c.target, status: ['bad', `DNA < ${brNum(c.minVol)} µL sem ajuste automático`] };
    const fc = r.conc * c.minVol / c.finalVol;
    return { ...o, vDNA: c.minVol, vDil: c.finalVol - c.minVol, finalConc: fc, adjusted: true, status: ['warn', `Ajustado: final ${brNum(fc)} ng/µL`] };
  }
  // O mesmo limite vale para o diluente: se faltaria menos que o mínimo, o robô pipeta só DNA (puro)
  // no volume final e a concentração final fica igual à do estoque (poço marcado com *).
  if (c.finalVol - vDNA > 0 && c.finalVol - vDNA < c.minVol) {
    if (!c.autoAdjust) return { ...o, vDNA, vDil: c.finalVol - vDNA, finalConc: c.target, status: ['bad', `Diluente < ${brNum(c.minVol)} µL sem ajuste automático`] };
    return { ...o, vDNA: c.finalVol, vDil: 0, finalConc: r.conc, adjusted: true, status: ['warn', `Ajustado: diluente < ${brNum(c.minVol)} µL, DNA puro (${brNum(r.conc)} ng/µL)`] };
  }
  return { ...o, vDNA, vDil: c.finalVol - vDNA, finalConc: c.target, status: ['ok', 'OK'] };
}
function normalizeBench(r, c) {
  // Bancada: diluição intermediária em tubo, respeitando o volume mínimo de pipetagem (DNA e água)
  const o = { vDNA: null, vDil: null, vPrep: null, predil: 0, finalConc: null, status: ['bad', 'Sem concentração'] };
  if (r.source === 'diluent') return { ...o, vDNA: 0, vDil: c.useVol, finalConc: 0, status: ['ok', 'Água / diluente'] };
  if (r.source === 'manual') return { ...o, status: ['warn', 'Adicionar manualmente'] };
  if (r.conc == null || r.conc <= 0) return o;
  const neat = msg => c.allowBelow ? { ...o, vDNA: null, vDil: 0, finalConc: r.conc, status: ['warn', msg] } : { ...o, status: ['bad', 'Abaixo do alvo'] };
  if (r.conc <= c.target) return neat('Abaixo do alvo: usar DNA puro');
  const solve = conc => {
    let vp = Math.max(c.prepVol, c.minVol * conc / c.target);
    if (vp - c.target * vp / conc < c.minVol) vp = Math.max(vp, c.minVol / (1 - c.target / conc));
    vp = Math.ceil(vp * 10 - 1e-9) / 10;
    return vp <= c.maxVol ? { vPrep: vp, vDNA: c.target * vp / conc, vDil: vp - c.target * vp / conc } : null;
  };
  let x = solve(r.conc);
  if (x) return { ...o, ...x, finalConc: c.target, status: x.vPrep > c.prepVol ? ['warn', `Preparar ${String(x.vPrep).replace('.', ',')} µL`] : ['ok', 'OK'] };
  if (c.minVol * r.conc / c.target <= c.maxVol) return neat('Próximo do alvo: usar DNA puro');   // limitação é a água, não o DNA
  for (const f of [2, 5, 10, 20, 50]) {
    if (r.conc / f <= c.target) break;
    x = solve(r.conc / f);
    if (x) return { ...o, ...x, predil: f, finalConc: c.target, status: ['warn', `Pré-diluir 1:${f} (${String(c.minVol).replace('.', ',')} µL DNA + ${String(c.minVol * (f - 1)).replace('.', ',')} µL água)`] };
  }
  return { ...o, status: ['bad', 'Fora da faixa: diluir manualmente'] };
}
/* posições na placa de reação: itens do robô na ordem do TXT; manuais no fim (ou na ordem) */
function assignReactionWells(rows, manualAtEnd) {
  const robot = rows.filter(r => r.source !== 'manual'), man = rows.filter(r => r.source === 'manual');
  const order = manualAtEnd ? [...robot, ...man] : rows.slice();
  return order.map((r, i) => ({ ...r, dest: i + 1, destWell: wellName(i + 1) }));
}

/* ---------- QIAgility: relatório pós-corrida (Post-Run Report) ---------- */
const VOL_RE = /^(\d+(?:[.,]\d+)?)\s*(?:[µμu\uFFFD]|ï¿½|Âµ)?l\s+(.+)$/i;  // µl pode chegar como µ, μ, u ou caractere inválido (codificação do Windows)
function parsePostRun(rows) {
  const all = rows.map(r => r.text).join('\n');
  const g = re => ((all.match(re) || [])[1] || '').trim();
  const info = {
    qasFile: g(/([\w.\-]+\.QAS)\b/i), user: g(/Username\s*:\s*(\S+)/), version: g(/QIAgility Version\s*([\d.]+(?:\s*\(Build\s*\d+\))?)/),
    serial: g(/serial number\s*:\s*(\S+)/i), start: g(/Start time\s*:\s*([^\n]*?(?:AM|PM))/i), stop: g(/Stop Time\s*:\s*([^\n]*?(?:AM|PM))/i),
    duration: g(/Duration\s*:\s*([\d:]+)/), position: g(/Position\s*:\s*([^\n]+)/), reportName: g(/^(\S+ Report \d{4}-\d{2}-\d{2}_[\d-]+)/m)
  };
  const hi = rows.findIndex(r => /\bExpected\b/.test(r.text) && /\bActual\b/.test(r.text));
  const wells = [];
  if (hi >= 0) {
    const H = rows[hi].items, hx = w => (H.find(i => i.str.startsWith(w)) || {}).x;
    const X = { id: hx('ID'), exp: hx('Expected'), act: hx('Actual'), conc: hx('Conc'), max: hx('Max') };
    if (X.id == null || X.exp == null || X.act == null) return { info, wells, tasks: [], error: 'Cabeçalho da tabela não reconhecido' };
    const b1 = (X.id + X.exp) / 2, b2 = (X.exp + X.act) / 2, b3 = (X.act + (X.conc ?? X.act + 100)) / 2, b4 = ((X.conc ?? b3) + (X.max ?? b3 + 50)) / 2;
    let end = rows.findIndex((r, i) => i > hi && /Indicates wells|Reaction steps|Task list/i.test(r.text)); if (end < 0) end = rows.length;
    const region = rows.slice(hi + 1, end).filter(r => !/Report \d{4}-|^file:\/\/|Page \d+ of/.test(r.text));
    const first = region.findIndex(r => /[µμ]l\b/.test(r.text) || r.items.some(i => i.x < b1 && /^[A-P]\d{1,2}$/.test(i.str)));
    if (first > 0) region.splice(0, first);
    const anchors = region.filter(r => r.items.some(i => i.x < b1 && /^[A-P]\d{1,2}$/.test(i.str)));
    anchors.forEach(a => wells.push({ anchor: a, rows: [] }));
    region.forEach(r => {
      if (!wells.length) return;
      let best = wells[0]; wells.forEach(w => { if (Math.abs(w.anchor.y - r.y) < Math.abs(best.anchor.y - r.y)) best = w; });
      best.rows.push(r);
    });
    wells.forEach(w => {
      const its = w.rows.sort((a, b) => a.y - b.y).flatMap(r => r.items.map(i => ({ ...i, ry: r.y })));
      const zone = (lo, hi2) => its.filter(i => i.x >= lo && i.x < hi2);
      const left = zone(-1e9, b1); w.well = (left.find(i => /^[A-P]\d{1,2}$/.test(i.str)) || {}).str;
      w.id = left.filter(i => !/^[A-P]\d{1,2}$/.test(i.str) || i.ry !== w.anchor.y || i !== left.find(j => /^[A-P]\d{1,2}$/.test(j.str))).map(i => i.str).join('');
      const contents = list => { const out = []; let cur = null, y = null;
        list.forEach(i => { if (i.ry !== y) { if (cur) out.push(cur); cur = { text: i.str }; y = i.ry; } else cur.text += ' ' + i.str; });
        if (cur) out.push(cur);
        const res = []; out.forEach(o => { const m = o.text.match(VOL_RE); if (m) res.push({ vol: numBR(m[1]), name: m[2].replace(/\s+/g, '') }); else if (res.length) res[res.length - 1].name += o.text.replace(/\s+/g, ''); });
        return res; };
      w.expected = contents(zone(b1, b2)); w.actual = contents(zone(b2, b3));
      const cz = zone(b3, b4); w.conc = numBR((cz.find(i => /^\d+[.,]\d+$/.test(i.str)) || {}).str); w.adjusted = cz.some(i => i.str === '*');
      const rz = zone(b4, 1e9); const nums = rz.filter(i => /^\d+([.,]\d+)?$/.test(i.str)).map(i => numBR(i.str));
      w.maxVol = nums[0] ?? null; w.finalVol = nums[1] ?? null;
      w.status = rz.filter(i => /^[A-Za-z]/.test(i.str) && !/^[µμu]l$/i.test(i.str)).map(i => i.str).join(' ');
      delete w.anchor; delete w.rows;
    });

/* ============ eventos ============ */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) { const ta = $('#exp-text') || $('#proto-json'); if (ta) { ta.focus(); ta.select(); } toast('Selecionado: use Ctrl+C'); }
}
function intakeStep() { return proto().steps.find(s => s.type === 'intake'); }
function setTxt(file, text) {
  const r = parseLimsTxt(text); if (!r.entries.length) { toast('Nenhum teste reconhecido no TXT (formato ID_NOME)'); return; }
  const s = st(run.current); s.txt = { file, entries: r.entries, bad: r.bad }; markReal(); render(); toast(`${r.entries.length} testes carregados`);
}
function addMap(file, lines) {
  const m = parseMapLines(lines); m.file = file;
  if (!m.rows.length) { toast(`Nenhuma amostra reconhecida em ${file}`); return false; }
  const s = st(run.current); s.maps = s.maps.filter(x => x.file !== file && (!m.code || x.code !== m.code)); s.maps.push(m); return true;
}
async function loadPostRun(f) {
  if (!f) return;
  const isHtml = /\.html?$/i.test(f.name), isPdf = /\.pdf$/i.test(f.name);
  if (!isHtml && !isPdf) { toast('Carregue o relatório .htm salvo pelo QIAgility'); return; }
  try {
    toast(`Lendo ${f.name}…`);
    let rep;
    if (isHtml) {
      const buf = await f.arrayBuffer();
      let text; try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
      rep = parsePostRunHtml(text);
    } else rep = parsePostRun(await pdfLines(await f.arrayBuffer()));
    if (!rep.wells.length) { toast('Não encontrei a tabela de reações neste arquivo'); return; }
    st(run.current).postRun = { file: f.name, at: stamp(), rep }; render(); toast(`${rep.wells.length} poços lidos do relatório`);
  } catch (e) { toast(`Não foi possível ler ${f.name}`); }
}
function markReal() { if (run.demo) { run.demo = false; const s = st(run.current); if (s.txt?.file === 'bateria_exemplo.txt') s.txt = null; s.maps = s.maps.filter(m => !DEMO_MAPS.some(d => d.file === m.file)); } }
async function handleFiles(files) {
  const list = [...files]; let n = 0;
  for (const f of list) {
    if (/\.pdf$/i.test(f.name)) {
      try { toast(`Lendo ${f.name}…`); const rows = await pdfLines(await f.arrayBuffer()); markReal(); if (addMap(f.name, rows.map(r => r.text))) n++; }
      catch (e) { toast(`Não foi possível ler ${f.name}. Use “Colar texto do mapa”.`); }
    } else if (/\.(txt|csv|tsv)$/i.test(f.name)) setTxt(f.name, await f.text());
  }
  if (n) { render(); toast(`${n} mapa(s) carregados`); }
}

    if (k === 'conc') m.conc = numBR(el.value); else if (k === 'row') m.row = el.value.trim().toUpperCase(); else m[k] = el.value.trim();
    if (k === 'source') { delete m.storeNum; }
    if (k === 'kind') { delete m.source; m.kindBy = stamp() + (run.meta.operator ? ' · ' + run.meta.operator : ''); }
    render(); return;
  }
  if (el.type === 'file' && el.files?.length) {
    if (el.id === 'f-txt' || el.id === 'f-pdf') await handleFiles(el.files);
    else if (el.id === 'f-qas') {
      const text = await el.files[0].text();
      try { const info = qasInfo(text); if (!info.sampleSlots.length) throw new Error('sem posições de amostra');
        qasTpl = { name: el.files[0].name + ` (QIAgility ${info.version})`, xml: text, builtin: false }; store.set(TPL_KEY, qasTpl); s.overrides.slots = {}; render(); toast('Modelo carregado'); }
      catch (err) { toast('Arquivo .QAS não reconhecido: ' + err.message); }
    }
    else if (el.id === 'f-openrun') { try { const o = JSON.parse(await el.files[0].text()); const r = o.run || o; if (!protocols.some(p => p.id === r.protocolId)) { toast('Protocolo desta corrida não existe neste navegador'); return; } run = r; render(); toast('Corrida aberta'); } catch (err) { toast('Arquivo de corrida inválido'); } }
    else if (el.id === 'f-posrun') await loadPostRun(el.files[0]);
    else if (el.id === 'f-pkg') await loadPkg(el.files);
    el.value = '';
  }
});
document.addEventListener('keydown', e => {   // Enter nas leituras do Qubit: vai para o próximo poço
  const el = e.target; if (e.key !== 'Enter' || el.dataset?.qv == null) return; e.preventDefault();
  const all = [...document.querySelectorAll('[data-qv]')], nx = all[all.indexOf(el) + 1]; if (nx) nx.focus(); else el.blur();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.matches?.('[data-datebr]')) return;
  let d = el.value.replace(/\D/g, '').slice(0, 8); if (d.length > 4) d = d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4); else if (d.length > 2) d = d.slice(0, 2) + '/' + d.slice(2);
  if (el.value !== d) el.value = d;
});
['dragover', 'dragleave', 'drop'].forEach(t => document.addEventListener(t, e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return; e.preventDefault();
  z.classList.toggle('drag', t === 'dragover');
  if (t === 'drop' && e.dataTransfer?.files?.length) { if (z.dataset.drop === 'pkg') loadPkg(e.dataTransfer.files); else if (z.dataset.drop === 'posrun') loadPostRun(e.dataTransfer.files[0]); else handleFiles(e.dataTransfer.files); }
}));

async function boot() {
  if (MODULE === 'pos') { $('#brand-h').textContent = 'Bancada NGS · Pós-PCR'; $('#brand-s').textContent = 'Dos amplicons à biblioteca'; $('.f-batch .label').textContent = 'Rodada de biblioteca'; $('#f-run').placeholder = 'nome da rodada'; }
  $('#work').innerHTML = '<p class="hint">Carregando protocolos e cadastros…</p>';
  await loadRepo();
  protocols = loadProtocols();
  run = store.get(RUN_KEY);
  if (run && !protocols.some(p => p.id === run.protocolId)) { const old = run.protocolId; run.protocolId = protocols[0].id; setTimeout(() => toast(`O kit “${old}” não existe mais; usando “${protocols[0].name}”`), 300); }
  if (!run) { run = newRun(protocols[0].id, true); seedDemo(); }
  run.id ||= uid();
  remapLegacy();
  render();
}
boot();
</script>
